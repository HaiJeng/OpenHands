## 从 ClusterIP 切换到 NodePort

如果您已经用 ClusterIP 部署了，可以升级：

```bash
# 升级现有部署
helm upgrade openhands ./openhands \
  --set service.type=NodePort \
  --set service.nodePort=30000 \
  --reuse-values

# 验证类型已更改
kubectl get svc openhands -o jsonpath='{.spec.type}'
```

## 注意事项

1. **NodePort 范围**：30000-32767
2. **端口冲突**：确保端口未被占用
3. **防火墙**：开放相应端口
4. **云服务商**：配置安全组规则
5. **DNS 解析**：如果使用域名，确保 DNS 正确
6. **负载均衡**：考虑使用 LoadBalancer 代替 NodePort
7. **监控**：监控外部访问流量和安全性

## 推荐配置

对于生产环境，建议使用 **LoadBalancer** 或 **Ingress** 而非 NodePort：

```yaml
# LoadBalancer 配置（推荐用于生产）
service:
  type: LoadBalancer
  port: 3000
  annotations:
    # AWS
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    # GCP
    cloud.google.com/load-balancer-type: "Internal"
```

LoadBalancer 优点：
- 自动分配外部 IP
- 集成云服务商负载均衡器
- 更好的可用性和性能
- 自动健康检查
