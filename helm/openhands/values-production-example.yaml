# Example values file for OpenHands Helm chart
# This file demonstrates common configuration scenarios

# ===================================================================
# Scenario 1: Production with specific image versions
# ===================================================================
# Use this for production deployments with pinned image versions
image:
  repository: docker.openhands.dev/openhands/openhands
  tag: v0.0.1  # Pin to specific version
  pullPolicy: IfNotPresent
  
  runtime:
    repository: ghcr.io/openhands/runtime
    tag: v0.0.1-runtime  # Pin runtime version
    
  agentServer:
    repository: ghcr.io/openhands/agent-server
    tag: v0.0.1-agent  # Pin agent server version
    
  uv:
    repository: ghcr.io/astral-sh/uv
    tag: latest

replicaCount: 3

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: openhands.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: openhands-tls
      hosts:
        - openhands.example.com

persistence:
  data:
    size: 20Gi
    storageClass: fast-ssd
  workspace:
    size: 100Gi
    storageClass: fast-ssd

resources:
  requests:
    cpu: 2
    memory: 4Gi
  limits:
    cpu: 8
    memory: 16Gi

# ===================================================================
# Scenario 2: Development/Testing
# ===================================================================
# Uncomment and use this for development environments
# image:
#   tag: dev
# 
# replicaCount: 1
# 
# resources:
#   requests:
#     cpu: 500m
#     memory: 1Gi
#   limits:
#     cpu: 2
#     memory: 4Gi
# 
# persistence:
#   data:
#     size: 5Gi
#   workspace:
#     size: 10Gi
# 
# openhands:
#   llm:
#     model: gpt-4o-mini  # Use cheaper model for development

# ===================================================================
# Scenario 3: Using Secrets for sensitive data
# ===================================================================
# First create the secret:
# kubectl create secret generic openhands-secrets \
#   --from-literal=llmApiKey=sk-... \
#   --from-literal=jwtSecret=your-jwt-secret

# Uncomment to use the secret:
# secret:
#   enabled: true
#   existingSecret: openhands-secrets
# 
# openhands:
#   llm:
#     apiKey: ""  # Leave empty, will use secret
#   jwtSecret: ""  # Leave empty, will use secret

# ===================================================================
# Scenario 4: Custom LLM provider
# ===================================================================
# Uncomment to use a custom LLM provider:
# openhands:
#   llm:
#     model: claude-3-opus-20240229
#     apiKey: sk-ant-...
#     baseURL: https://api.anthropic.com/v1
#     customProvider: anthropic

# ===================================================================
# Scenario 5: GPU support
# ===================================================================
# Uncomment to enable GPU support in runtime:
# openhands:
#   sandbox:
#     enableGPU: true
#     cudaVisibleDevices: "0,1"  # Use specific GPUs
# 
# kubernetes:
#   runtimePrivileged: false
#   runtimeNodeSelector:
#     nvidia.com/gpu.present: "true"
#   runtimeTolerations:
#     - key: nvidia.com/gpu
#       operator: Exists
#       effect: NoSchedule

# ===================================================================
# Scenario 6: Docker-in-Docker (DinD) mode
# ===================================================================
# Use this if you need Docker-in-Docker support:
# dockerSocket:
#   enabled: true
#   hostPath: /var/run/docker.sock
# 
# kubernetes:
#   runtimePrivileged: true  # Required for DinD
# 
# securityContext:
#   privileged: true

# ===================================================================
# Common configurations
# ===================================================================

# Workspace configuration
openhands:
  workspace:
    base: /opt/workspace_base
    mountPath: /workspace
    initGit: true
  
  # LLM configuration (use secrets in production!)
  llm:
    model: gpt-4o
    apiKey: ""  # Set this or use secret
    baseURL: ""
    temperature: 0.0
    maxTokens: 0
  
  # Security settings
  security:
    enableAnalyzer: true
    analyzerType: llm
  
  # Agent capabilities
  agent:
    defaultAgent: CodeActAgent
    enableBrowsing: true
    enableJupyter: true
    enableEditor: true
    enableCmd: true
  
  # Sandbox settings
  sandbox:
    runtime: docker
    keepAlive: false
    maxIterations: 500
    maxBudget: 0.0
    enableGPU: false
  
  # File store
  fileStore:
    type: local
    path: /.openhands
  
  # Browser
  browser:
    enabled: true
  
  # JWT secret (generate a strong random string in production!)
  jwtSecret: ""  # Set this or use secret
  
  # Conversation limits
  conversation:
    maxConcurrent: 3
    maxAgeSeconds: 864000

# Kubernetes runtime configuration
kubernetes:
  namespace: default
  pvc:
    storageSize: 10Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  runtimeResources:
    cpu:
      request: "1"
      limit: "4"
    memory:
      request: "1Gi"
      limit: "4Gi"
  runtimePrivileged: false

# Service configuration
service:
  type: ClusterIP
  port: 3000

# Docker socket (required for Docker runtime)
dockerSocket:
  enabled: true
  hostPath: /var/run/docker.sock
