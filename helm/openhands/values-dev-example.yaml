# Example values file for development/testing
# Use this for quick local testing

image:
  tag: latest

replicaCount: 1

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2
    memory: 4Gi

persistence:
  size: 5Gi

openhands:
  llm:
    model: gpt-4o-mini  # Cheaper model for testing
    apiKey: ""  # Set your API key

ingress:
  enabled: false

autoscaling:
  enabled: false

# For local testing with port-forward
service:
  type: ClusterIP
  port: 3000
