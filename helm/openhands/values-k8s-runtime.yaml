# OpenHands Kubernetes Runtime 配置
# ⚠️ 此配置不需要 Docker socket，使用原生 Kubernetes Pod

## 核心配置
openhands:
  # 使用 Kubernetes runtime（而不是 Docker）
  sandbox:
    runtime: kubernetes
    # 不需要 Docker-in-Docker
    keepAlive: false
    maxIterations: 500
    maxBudget: 0.0
    enableGPU: false

  # LLM 配置
  llm:
    apiKey: "your-api-key-here"  # 替换为实际的API密钥
    model: gpt-4o
    temperature: 0.0
    maxTokens: 0

## Kubernetes Runtime 配置
kubernetes:
  # Runtime Pod 的命名空间
  namespace: default
  
  # PVC 配置
  pvc:
    storageSize: 10Gi
    storageClass: "rbd"  # 或 "fast-ssd"
    accessMode: ReadWriteOnce
  
  # Runtime Pod 资源配置
  runtimeResources:
    cpu:
      request: "1"
      limit: "4"
    memory:
      request: "1Gi"
      limit: "4Gi"
  
  # Runtime Pod 需要特权模式（用于构建Docker镜像等操作）
  runtimePrivileged: true
  
  # Runtime Pod 的节点选择器（可选）
  runtimeNodeSelector: {}
  
  # Runtime Pod 的容忍度（可选）
  runtimeTolerations: []

## ⚠️ 关键：禁用 Docker Socket 挂载
# 使用 Kubernetes runtime 时，不需要访问 Docker socket
dockerSocket:
  enabled: false  # 禁用 Docker socket 挂载

## 安全上下文配置
# 使用 Kubernetes runtime 时，主容器不需要 root 权限
podSecurityContext:
  fsGroup: 42420
  runAsUser: 42420
  runAsGroup: 42420

securityContext:
  privileged: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 42420
  capabilities:
    drop:
      - ALL

## 网络配置
network:
  dns:
    servers:
      - 8.8.8.8
      - 8.8.4.4
  timeouts:
    githubApi: 60
    gitlabApi: 60
    general: 120

## 持久化存储配置
persistence:
  enabled: true
  
  # 数据持久化（配置、对话、文件存储等）
  data:
    enabled: true
    existingClaim: ""
    storageClass: "rbd"
    accessMode: ReadWriteOnce
    size: 5Gi
  
  # 工作区持久化（用户代码、项目等）
  workspace:
    enabled: true
    existingClaim: ""
    storageClass: "rbd"
    accessMode: ReadWriteOnce
    size: 10Gi

## 资源配置
resources:
  limits:
    cpu: 4
    memory: 8Gi
  requests:
    cpu: 1
    memory: 2Gi

## 服务配置
service:
  type: ClusterIP
  port: 3000

## Ingress 配置（可选）
ingress:
  enabled: false
  # className: "nginx"
  # annotations:
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
  # hosts:
  #   - host: openhands.example.com
  #     paths:
  #       - path: /
  #         pathType: Prefix
  # tls:
  #   - secretName: openhands-tls
  #     hosts:
  #       - openhands.example.com

## 密钥配置（使用命令行传入更安全）
openhands:
  jwtSecret: ""  # 使用: --set openhands.jwtSecret="$(openssl rand -base64 32)"
  secretKey: ""   # 使用: --set openhands.secretKey="$(openssl rand -base64 32)"

## 镜像配置
image:
  repository: docker.openhands.dev/openhands/openhands
  tag: latest
  pullPolicy: IfNotPresent
  
  # Runtime 镜像（用于 Kubernetes Pod）
  runtime:
    repository: ghcr.io/openhands/runtime
    tag: latest
    pullPolicy: IfNotPresent
  
  # Agent Server 镜像
  agentServer:
    repository: ghcr.io/openhands/agent-server
    tag: latest
    pullPolicy: IfNotPresent

## 自动扩缩容配置
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

## 部署配置
replicaCount: 1

## 副本集更新策略
updateStrategy:
  type: Recreate

## 服务账户配置
serviceAccount:
  create: true
  annotations: {}
  name: ""

## 镜像拉取密钥
imagePullSecrets: []

## Pod 注解
podAnnotations: {}

## 节点选择器
nodeSelector: {}

## 容忍度
tolerations: []

## 额外环境变量
extraEnv: []

## 额外卷挂载
extraVolumeMounts: []

## 额外卷
extraVolumes: []

## ConfigMap 配置
config:
  enabled: false

## Secret 配置
secret:
  enabled: false
