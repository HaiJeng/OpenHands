# Default values for itijsin-platform.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  imagePullPolicy: IfNotPresent
  repository: harbor.inspur.local/iai-release

# Deployment升级策略
updateStrategy:
  type: Recreate

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  requests:
    cpu: "1000m"
    memory: "2Gi"
  limits:
    cpu: "2000m"
    memory: "4Gi"

persistence:
  storageClass: "rbd"
  accessMode: ReadWriteOnce
  size: 50Gi

omegagpt:
  sandbox:
    replicas: 1
    imageName: sandbox
    appName: sandbox
    tag: 3.2.1
    port: 3000
    service:
      type:
      nodePort:
  mcpStdio:
    replicas: 1
    port: 8088
    imageName: mcp-stdio
    appName: mcp-stdio
    tag: 3.2.1
    service:
      type:
      nodePort:
  codePlugin:
    port: 8018
    service:
      type:
      nodePort:

npm_config_registry:
  url: https://registry.npmmirror.com/
mcp:
  client:
    insecure_urls: "https://192.168.12.188:35556/*,https://192.168.12.75:35556/*"
    maxRetryAttempts: 1
