apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.omegagpt.mcpStdio.appName }}-logs-pvc
spec:
  accessModes:
    - {{ .Values.persistence.accessMode | quote }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
  storageClassName: "{{ .Values.persistence.storageClass }}"